plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yuanbao.qqbot'
    compileSdk 34

    defaultConfig {
        applicationId "com.yuanbao.qqbot"
        minSdk 26
        targetSdk 34
        // v1.1：签名从此固定（见 keystore/qfish-debug.jks）。
        // 从 v1.0 升上来必须卸载重装一次 —— 旧包是 CI 每次现生成的证书，对不上。
        // v1.2：QQ Agent 换代（旧的 TypeScript 版 → 内置原版 0.4.0 离线包），
        //       版本号跳一位，方便用户确认装上的确实是新版。
        // v1.3：全离线化 —— rootfs / 290 个 arm64 依赖包 / SnowLuma / noVNC / hook
        //       全部打进 APK，部署时只解压不联网（只剩 QQ 安装包还要下）。
        // v1.3.1：修 v1.2 日志里暴露的四个问题 —— linuxqq 半配置态、热更新屏蔽未生效、
        //       未登录时 OneBot 端口 000 被误报成故障、导出日志里签名指纹恒为「未知」。
        // v1.3.2：OneBot 令牌自动对齐（协议端随机令牌 vs 面板空令牌 → 永远连不上）；
        //       面板 UI 手机适配（mobile.css / mobile.js，列表与详情单栏切换）。
        // v1.3.3：修「一键部署走到 [10/10] 后日志停住、界面一直转圈」——
        //       proot 是 ptrace supervisor，会等所有子孙进程退出才返回，
        //       而 start-all.sh 拉起的全是常驻进程。改 launch（不等待）。
        versionCode 11
        versionName "1.3.7"
        // 只做 arm64：QQ / SnowLuma / hook 都是 aarch64
        ndk { abiFilters 'arm64-v8a' }
    }

    // offline/ 下都是已经压过的东西（.deb 是 xz、rootfs 与 SnowLuma 是 gzip），
    // 再让 aapt 压一遍只是白白多花几分钟构建时间，压缩率还不到 1%。
    // 不压的另一个好处：安装后 assets 可以直接按原始偏移读，解压更快。
    androidResources {
        noCompress += ['pkg', 'so']
    }

    // legacyPackaging=true：把 .so 原样解压到 nativeLibraryDir，
    // 我们才能 exec 那个伪装成 libproot.so 的 proot 可执行文件。
    packagingOptions { jniLibs { useLegacyPackaging true } }

    // 固定调试签名。
    // GitHub Actions 每次都是全新 runner，默认的 ~/.android/debug.keystore 不存在时
    // AGP 会自动生成一个新的 —— 每次构建签名都不同，用户没法覆盖安装。
    // 这里把签名库钉进仓库，保证所有产物签名一致（仅用于自用调试分发，不是发布密钥）。
    // 注意：必须在 buildTypes 之前声明，否则 buildTypes 里引用 signingConfigs.qfish 会报
    // 「Could not find property」——Groovy DSL 是按出现顺序求值的。
    signingConfigs {
        qfish {
            storeFile file("keystore/qfish-debug.jks")
            storePassword "qfish123456"
            keyAlias "qfish"
            keyPassword "qfish123456"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.qfish
        }
        release {
            minifyEnabled false
            // 还没有正式发布密钥，先复用同一把签名，避免 debug/release 互相覆盖不了
            signingConfig signingConfigs.qfish
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

// 构建前先确保 proot 就位
tasks.named('preBuild').configure { dependsOn rootProject.tasks.named('fetchProot') }

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}

// ===== 构建后自动校验 APK 签名指纹 =====
// 为什么放在 Gradle 而不是 CI workflow：改 .github/workflows/* 需要 token 带
// workflow scope，当前分发凭据没有；而签名一旦漂移，用户就装不上新包 —— 只能
// 卸载重装，rootfs / QQ / 登录态全部清空。放在这里本地打包也会查，比 CI 单点更广。
// 为什么用 finalizedBy 而不是 dependsOn：CI 只跑 `gradle assembleDebug`，挂成
// finalizer 才能在不改 workflow 的前提下自动触发；反过来写成 dependsOn 会和
// assembleDebug 形成依赖环。
def QFISH_CERT_SHA256 = "57927f540f57af7b600c94cdedb05321d37c8bce759374b00f171c2b517daeb8"
def qfishApkRoot = new File(project.layout.buildDirectory.get().asFile, "outputs/apk")
def qfishKeystore = file("keystore/qfish-debug.jks")
// 本地可能没有配 SDK（配置阶段就会抛），拿不到就退化成"只查 keystore 在不在"
def qfishSdkPath = null
try { qfishSdkPath = android.sdkDirectory?.absolutePath } catch (Throwable ignored) { }

tasks.register("verifyApkSignature") {
    group = "verification"
    description = "校验 APK 签名证书 SHA-256 是否与固定签名库一致（防签名漂移导致无法覆盖安装）"

    doLast {
        if (!qfishKeystore.isFile()) {
            throw new GradleException("""
✗ 固定签名库不见了：${qfishKeystore}
  缺了它 AGP 会退回 ~/.android/debug.keystore，CI 每次现生成一把新证书，
  打出来的包签名各不相同，用户就没法覆盖安装。
  恢复：git checkout -- app/keystore/qfish-debug.jks
""".toString())
        }

        // 只查真正打出来的 APK；assemble 失败时这里为空，跳过（别掩盖原始错误）
        def apks = []
        if (qfishApkRoot.isDirectory()) {
            qfishApkRoot.eachDir { d -> d.eachFileMatch(~/.*\.apk/) { apks << it } }
        }
        if (apks.isEmpty()) {
            logger.warn("⚠ outputs/apk 下没有 APK，跳过签名校验")
            return
        }

        // apksigner 随 build-tools 分发，取版本号最大的一个
        def signer = null
        if (qfishSdkPath != null) {
            def btRoot = new File(qfishSdkPath, "build-tools")
            if (btRoot.isDirectory()) {
                def dirs = (btRoot.listFiles() ?: new File[0]).findAll { it.isDirectory() }
                dirs.sort { a, b -> b.name <=> a.name }
                signer = dirs.collect { new File(it, "apksigner") }.find { it.isFile() }
            }
        }
        if (signer == null) {
            logger.warn("⚠ 找不到 apksigner（SDK=${qfishSdkPath}），跳过签名校验。期望指纹 ${QFISH_CERT_SHA256}")
            return
        }

        apks.each { apk ->
            // 用 ProcessBuilder 而不是 project.exec：task action 里不碰 project，
            // 以后开 configuration cache 也不会炸
            def pb = new ProcessBuilder(signer.absolutePath, "verify", "--print-certs", apk.absolutePath)
            pb.redirectErrorStream(true)
            def proc = pb.start()
            def text = proc.inputStream.getText("UTF-8")
            proc.waitFor()

            def m = text =~ /SHA-256 digest:\s*([0-9a-fA-F:]+)/
            if (!m.find()) {
                // 不同 apksigner 版本措辞会变，解析不到只警告不失败，避免误伤构建
                logger.warn("⚠ ${apk.name}: 未能解析签名指纹，跳过校验")
                logger.warn(text.readLines().take(10).join("\n"))
                return
            }
            def got = m.group(1).replace(":", "").toLowerCase()
            if (got != QFISH_CERT_SHA256) {
                throw new GradleException("""
✗ ${apk.name} 签名指纹不一致 —— 这个包装到手机上覆盖不了旧版
  期望 : ${QFISH_CERT_SHA256}
  实际 : ${got}
  排查 : app/build.gradle 的 signingConfigs.qfish 是否被改过 / keystore 是否被替换
""".toString())
            }
            logger.lifecycle("✓ ${apk.name} 签名指纹一致（${got.take(16)}…），可覆盖安装")
        }
    }
}

// 任何一次 assembleDebug / assembleRelease 结束都会跟一次校验
tasks.matching { it.name == "assembleDebug" || it.name == "assembleRelease" }.configureEach {
    finalizedBy "verifyApkSignature"
}

// ---------------------------------------------------------------------------
// 内置离线资源（274MB）：不在仓库里，构建时从 Release 下。
//
// 为什么不提交进仓库：
//   1. pkgs-a.pkg / pkgs-b.pkg 各 97MB，已经贴着 GitHub 单文件 100MiB 上限，
//      再大一点就直接 push 被拒；
//   2. 这些是二进制大块，git 压不动，仓库历史会线性膨胀，clone 越来越慢；
//   3. 换个资源就要重写历史，不划算。
// 放在 Release（tag = offline-v1.3.2）上，单文件限额 2GB，且可以单独替换。
//
// 本地已经有这些文件时直接跳过，所以日常 Build > Run 不受影响。
tasks.register('fetchOfflineAssets') {
    description = '下载 APK 内置的离线资源（rootfs / 290 个 deb / SnowLuma / noVNC）'
    group = 'build'

    def manifest = [
        'rootfs.pkg'  : 29870567L,
        'pkgs-a.pkg'  : 101990400L,
        'pkgs-b.pkg'  : 101990400L,
        'snowluma.pkg': 51816108L,
        'novnc.pkg'   : 993280L,
    ]
    def tag = 'offline-v1.3.2'
    def base = "https://github.com/2136206076/QQBotContainer9/releases/download/${tag}"

    doLast {
        def dir = file('src/main/assets/qqstack/offline')
        dir.mkdirs()
        manifest.each { name, size ->
            def f = new File(dir, name)
            if (f.exists() && f.length() == size) {
                logger.lifecycle("· 离线资源 ${name} 已就位")
                return
            }
            logger.lifecycle("↓ 下载离线资源 ${name}（${(size / 1048576).round()}MB）")
            def tmp = new File(dir, "${name}.part")
            try {
                new URL("${base}/${name}").openStream().withCloseable { inp ->
                    tmp.withOutputStream { out -> out << inp }
                }
                if (tmp.length() != size) {
                    throw new GradleException("${name} 大小不符：期望 ${size}，实得 ${tmp.length()}\n"
                        + "  可能是 Release 资产被替换过，或 tag ${tag} 不存在")
                }
                if (f.exists()) f.delete()
                if (!tmp.renameTo(f)) {
                    throw new GradleException("${name} 下载完成但改名失败")
                }
            } finally {
                if (tmp.exists()) tmp.delete()
            }
        }
        logger.lifecycle('✓ 离线资源齐备')
    }
}

// preBuild 是一切编译/打包任务的根，挂在它上面能保证 mergeAssets 之前文件就位
tasks.configureEach { t ->
    if (t.name == 'preBuild') t.dependsOn 'fetchOfflineAssets'
}
