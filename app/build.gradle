plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yuanbao.qqbot'
    compileSdk 34

    defaultConfig {
        applicationId "com.yuanbao.qqbot"
        minSdk 26
        targetSdk 34
        // v1.1：签名从此固定（见 keystore/qfish-debug.jks）。
        // 从 v1.0 升上来必须卸载重装一次 —— 旧包是 CI 每次现生成的证书，对不上。
        versionCode 2
        versionName "1.1"
        // 只做 arm64：QQ / SnowLuma / hook 都是 aarch64
        ndk { abiFilters 'arm64-v8a' }
    }

    // legacyPackaging=true：把 .so 原样解压到 nativeLibraryDir，
    // 我们才能 exec 那个伪装成 libproot.so 的 proot 可执行文件。
    packagingOptions { jniLibs { useLegacyPackaging true } }

    // 固定调试签名。
    // GitHub Actions 每次都是全新 runner，默认的 ~/.android/debug.keystore 不存在时
    // AGP 会自动生成一个新的 —— 每次构建签名都不同，用户没法覆盖安装。
    // 这里把签名库钉进仓库，保证所有产物签名一致（仅用于自用调试分发，不是发布密钥）。
    // 注意：必须在 buildTypes 之前声明，否则 buildTypes 里引用 signingConfigs.qfish 会报
    // 「Could not find property」——Groovy DSL 是按出现顺序求值的。
    signingConfigs {
        qfish {
            storeFile file("keystore/qfish-debug.jks")
            storePassword "qfish123456"
            keyAlias "qfish"
            keyPassword "qfish123456"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.qfish
        }
        release {
            minifyEnabled false
            // 还没有正式发布密钥，先复用同一把签名，避免 debug/release 互相覆盖不了
            signingConfig signingConfigs.qfish
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

// 构建前先确保 proot 就位
tasks.named('preBuild').configure { dependsOn rootProject.tasks.named('fetchProot') }

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
